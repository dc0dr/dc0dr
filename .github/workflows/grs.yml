name: can you update the README cards please?

on:
  schedule:
    - cron: "0 0,14 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&custom_title=gotta%20rack%20up%20those%20numbers&show_icons=true&include_all_commits=true&theme=darcula
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&custom_title=typescript?%20%most%20used?&layout=compact&langs_count=4&theme=darcula
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=${{ github.repository }}&custom_title=pinned%20repositories&theme=darcula
          path: profile/pin-stats-organization-github-readme-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "dc0dr"
          git config user.email "[EMAIL_ADDRESS]"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push